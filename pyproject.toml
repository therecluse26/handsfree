[project]
name = "handsfree"
version = "0.1.0"
description = "Hands-free mouse for Linux: webcam gaze tracking for the cursor, facial gestures for clicks. Runs fully locally."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["accessibility", "eye-tracking", "gaze", "hands-free", "mouse", "linux", "wayland"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Adaptive Technologies",
]
dependencies = [
    "mediapipe>=1.2.3",
    "numpy>=2.0",
    "opencv-python-headless>=5.0.0.93",
    "pyside6-essentials>=6.12.0",
]

[project.scripts]
handsfree = "handsfree.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
# Only for training the gaze model. The app itself does not need PyTorch.
train = [
    "torch>=2.6",
    "onnx>=1.17",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
